name: diag-token
on: workflow_dispatch
permissions: { contents: read }
jobs:
  d:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: ver archivo y bloque
        shell: 'powershell -ExecutionPolicy Bypass -command ". {0}"'
        run: |
          Write-Host "== archivo .secrets =="
          if (Test-Path 'C:\admon\.secrets\panel_token') {
            $c = Get-Content 'C:\admon\.secrets\panel_token' -Raw
            Write-Host ("  EXISTE, {0} bytes, vacio={1}" -f $c.Length, [string]::IsNullOrWhiteSpace($c))
          } else { Write-Host "  NO EXISTE C:\admon\.secrets\panel_token" }
          Write-Host "== commit de C:\admon =="
          (git -C C:\admon rev-parse --short HEAD)
          Write-Host "== tiene el bloque el build.ps1 de C:\admon? =="
          if (Select-String -Path 'C:\admon\deploy\build.ps1' -Pattern 'HUB_PANEL_TOKEN' -Quiet) { Write-Host "  SI" } else { Write-Host "  NO (build.ps1 viejo)" }
          Write-Host "== ultimas lineas con PANEL del build.log anterior =="
          Get-Content 'C:\admon\build.log*' -ErrorAction SilentlyContinue | Select-String 'PANEL|secrets|AVISO' | Select-Object -Last 8
