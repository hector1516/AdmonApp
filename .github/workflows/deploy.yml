# ─────────────────────────────────────────────────────────────────────────────
# Admon · deploy automático
#
# DÓNDE SE DESPLIEGA
# La app que usan los usuarios vive en WebbApps (Debian, 10.188.141.17), en el
# contenedor docker `admon` publicado en el puerto 8103. El deploy corre ahí, en
# el runner `WebbApps-Runner` (label `admon-deploy`).
#
# Antes este workflow corría en un runner Windows (ServerVM 10.188.141.31) con
# PowerShell 5.1, cygpath, schtasks y C:\admon. Ese servidor ya no publica la
# app, así que los deploys "tenían éxito" en una máquina a la que nadie llega:
# el síntoma era que GitHub decía success y la app seguía igual.
#
# LA IDEA (estándar de las 6 apps): no distinguir tipos de cambio.
#   push → `build-image` (nube) construye y publica en ghcr.io → el job `deploy`
#   solo BAJA la imagen → el operador da Update en Arcane.
#
# ── Por qué ya no hay gate (hotsync vs rebuild) ──────────────────────────────
# Hasta 2026-10-08 el workflow tenía un `gate` que miraba QUÉ archivos cambió el
# push y elegía entre `hotsync` (solo código/estáticos) y `rebuild` (imagen). Con
# Arcane como dueño del contenedor, hotsync no puede aplicar nada: copiar dentro
# del contenedor vivo se perdería en el próximo Update. Así que terminaba
# delegando en rebuild: dos caminos para el mismo resultado, uno de ellos
# silenciosamente inútil y difícil de diagnosticar. Ahora TODO push construye y
# publica imagen y el único que aplica es el Update de Arcane. Es el mismo
# cambio que se hizo en Field (ver ReglasUpdateField.md).
#
# ── Sobre la etiqueta `admon-deploy` ─────────────────────────────────────────
# Hay dos runners de este repo: `WebbApps-Runner` (Linux) y `AdmonApp-Runner`
# (Windows, el viejo). Con `runs-on: self-hosted` cualquiera de los dos puede
# tomar el job, y el de Windows es el que ya no sirve. Por eso el deploy pide la
# etiqueta explícita `admon-deploy`.
# ─────────────────────────────────────────────────────────────────────────────
name: Deploy Admon

on:
  push:
    branches: [master]
  workflow_dispatch:

# Un push nuevo cancela el anterior en vez de esperarlo en cola: si el anterior
# está atascado por falta de runner, el nuevo tampoco podría arrancar. Con
# cancel-in-progress en false, uno atascado retenía el grupo y congelaba todos
# los deploys siguientes.
concurrency:
  group: deploy-admon
  cancel-in-progress: true

jobs:
  # No se puede consultar la API de runners desde el workflow: exige permiso de
  # administración de repos, que GITHUB_TOKEN no tiene (devuelve 403), así que
  # un guard que la consulte concluye "no hay runner" aunque lo haya. En vez de
  # preguntar, este job usa solo `actions: write` (que sí tiene): cancela los
  # Deploys atascados más de 10 min y dice cuál es la causa habitual.
  desbloquear:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Cancelar deploys atascados
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LIMITE=$(date -u -d '-10 minutes' +%Y-%m-%dT%H:%M:%SZ)
          ATASCADOS=$(gh api "repos/${{ github.repository }}/actions/runs?status=queued" \
            --jq "[.workflow_runs[] | select(.name | startswith(\"Deploy\"))
                   | select(.created_at < \"$LIMITE\")] | .[] | .id")
          if [ -z "$ATASCADOS" ]; then
            echo "::notice::nada atascado"
            exit 0
          fi
          echo "::error::deploy(s) con mas de 10 min en cola: $(echo "$ATASCADOS" | tr '\n' ' ')"
          echo "::error::casi siempre es que el runner WebbApps-Runner esta caido:"
          echo "::error::  systemctl status actions-runner-admonapp   (en 10.188.141.17)"
          echo "$ATASCADOS" | while read -r id; do
            gh api -X POST "repos/${{ github.repository }}/actions/runs/$id/cancel" >/dev/null 2>&1 \
              && echo "  cancelado $id" || true
          done

  # ─────────────────────────────────────────────────────────────────────────────
  # ESTÁNDAR DE DESPLIEGUE — el mismo en las 6 apps:
  #   1. build + push a ghcr.io, AQUÍ en la nube
  #   2. el servidor solo BAJA la imagen — nunca compila
  #   3. Arcane ve el digest nuevo y el operador da "Update" en la UI
  #
  # El Dockerfile arma el frontend (Vite) en una etapa node:20-alpine, así que
  # este job no necesita npm aparte.
  # ─────────────────────────────────────────────────────────────────────────────
  build-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumen
        run: |
          {
            echo "### Imagen publicada en la nube"
            echo ""
            echo "- **sha**: \`${{ github.sha }}\`"
            echo "- **tags**: \`${{ github.repository_owner }}/${{ github.event.repository.name }}\` → :latest + :sha"
            echo "- **runner**: \`${{ runner.name }}\` (nube — el servidor no compiló nada)"
            echo ""
            echo "Arcane ya la ve como actualización pendiente:"
            echo "**Projects → admon → Updates → Update**."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    # Etiqueta propia del runner de WebbApps (Linux). NO usar `self-hosted`: con
    # esa etiqueta el job podría caer en el runner Windows viejo, que es
    # justamente de donde viene este cambio.
    runs-on: admon-deploy
    timeout-minutes: 30
    needs: [build-image]
    permissions:
      contents: read
      # Para `docker pull` del paquete de ghcr.io que creó el job build-image.
      packages: read

    env:
      # Se baja el tag por sha, que es inmutable. Con ":latest" dos builds en
      # paralelo podrían pisarse.
      IMAGE_REF: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Resumen
        run: |
          {
            echo "### Deploy de Admon → WebbApps (10.188.141.17)"
            echo ""
            echo "- **modo**: rebuild (siempre: ya no hay gate)"
            echo "- **por qué**: la CI construye y publica; el cambio lo aplica el operador en Arcane"
            echo "- **runner**: ${{ runner.name }}"
            echo "- **commit**: ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"

      # Imagen nueva: login, pull y aviso. No recrea el contenedor: lo administra
      # Arcane (docker.ecc-sa.com.mx) y el guard de rebuild-linux.sh lo impide.
      # El paso que aplica el cambio es el Update de Arcane.
      - name: Deploy de la imagen
        env:
          # rebuild-linux.sh publica/consulta GHCR con este token. Sin él, la
          # imagen queda solo en disco y Arcane nunca ve actualizaciones.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash deploy/rebuild-linux.sh
