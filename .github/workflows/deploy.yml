# ─────────────────────────────────────────────────────────────────────────────
# Admon · deploy automático
#
# DÓNDE SE DESPLIEGA
# La app que usan los usuarios vive en WebbApps (Debian, 10.188.141.17), en el
# contenedor docker `admon` publicado en el puerto 8103. El deploy corre ahí, en
# el runner `WebbApps-Runner` (label `admon-deploy`).
#
# Antes este workflow corría en un runner Windows (ServerVM 10.188.141.31) con
# PowerShell 5.1, cygpath, schtasks y C:\admon. Ese servidor ya no publica la
# app, así que los deploys "tenían éxito" en una máquina a la que nadie llega:
# el síntoma era que GitHub decía success y la app seguía igual.
#
# LA IDEA: no reconstruir la imagen en cada push. El gate mira QUÉ archivos
# cambió y elige entre dos caminos:
#
#   hotsync  → deploy/hotsync-linux.sh  (compila el front y copia dist/ y api/
#              al contenedor que ya corre, sin docker build). Es lo de siempre.
#   rebuild  → deploy/rebuild-linux.sh  (reconstruye la imagen y recrea el
#              contenedor). Solo cuando el push tocó un insumo de la IMAGEN:
#              Dockerfile / requirements.txt / api/requirements.txt
#
# ── Sobre el shell de los pasos ──────────────────────────────────────────────
# El runner de WebbApps es Linux: todos los pasos van en bash. El gate NO corre
# en el runner sino en ubuntu-latest, porque solo compara archivos vía la API de
# GitHub y así no depende de que el runner esté vivo.
#
# ── Sobre la etiqueta `admon-deploy` ─────────────────────────────────────────
# Hay dos runners de este repo: `WebbApps-Runner` (Linux) y `AdmonApp-Runner`
# (Windows, el viejo). Con `runs-on: self-hosted` cualquiera de los dos puede
# tomar el job, y el de Windows es el que ya no sirve. Por eso el deploy pide la
# etiqueta explícita `admon-deploy`.
# ─────────────────────────────────────────────────────────────────────────────
name: Deploy Admon

on:
  push:
    branches: [master]
  workflow_dispatch:

# Un push nuevo cancela el anterior en vez de esperarlo en cola: si el anterior
# está atascado por falta de runner, el nuevo tampoco podría arrancar. Con
# cancel-in-progress en false, uno atascado retenía el grupo y congelaba todos
# los deploys siguientes.
concurrency:
  group: deploy-admon
  cancel-in-progress: true

jobs:
  # No se puede consultar la API de runners desde el workflow: exige permiso de
  # administración de repos, que GITHUB_TOKEN no tiene (devuelve 403), así que
  # un guard que la consulte concluye "no hay runner" aunque lo haya. En vez de
  # preguntar, este job usa solo `actions: write` (que sí tiene): cancela los
  # Deploys atascados más de 10 min y dice cuál es la causa habitual.
  desbloquear:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Cancelar deploys atascados
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LIMITE=$(date -u -d '-10 minutes' +%Y-%m-%dT%H:%M:%SZ)
          ATASCADOS=$(gh api "repos/${{ github.repository }}/actions/runs?status=queued" \
            --jq "[.workflow_runs[] | select(.name | startswith(\"Deploy\"))
                   | select(.created_at < \"$LIMITE\")] | .[] | .id")
          if [ -z "$ATASCADOS" ]; then
            echo "::notice::nada atascado"
            exit 0
          fi
          echo "::error::deploy(s) con mas de 10 min en cola: $(echo "$ATASCADOS" | tr '\n' ' ')"
          echo "::error::casi siempre es que el runner WebbApps-Runner esta caido:"
          echo "::error::  systemctl status actions-runner-admonapp   (en 10.188.141.17)"
          echo "$ATASCADOS" | while read -r id; do
            gh api -X POST "repos/${{ github.repository }}/actions/runs/$id/cancel" >/dev/null 2>&1 \
              && echo "  cancelado $id" || true
          done

  # El gate va en ubuntu-latest a propósito: es el paso que decide entre
  # hotsync y rebuild, y si se queda atascado por runner perdido no hay forma de
  # que el propio gate avise. Corriendo en GitHub-hosted eso no puede pasar.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      modo: ${{ steps.decidir.outputs.modo }}
      motivo: ${{ steps.decidir.outputs.motivo }}
    steps:
      - uses: actions/checkout@v4
        with:
          # El gate necesita historial para comparar contra el push anterior.
          fetch-depth: 0

      - name: Decidir rebuild vs hotsync
        id: decidir
        env:
          # gh lo necesita para la API de compare; sin esto responde con un
          # error de ayuda y rc=4, y el gate no puede leer la lista de cambios.
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -uo pipefail

          # `git diff` es el plan B: depende de que el clon tenga ese commit, y
          # en un clon shallow "Could not access <sha>" lo rompe. La API de
          # compare es autoritativa y no depende del clon, así que va primero.
          # Si no hay forma de saber, se reconstruye: es el camino
          # conservador, nunca adivinar "hotsync".
          changed=()
          diag=""

          echo "── API de compare"
          api_names=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$AFTER" --jq '.files[].filename' 2>&1)
          rc=$?
          api_names=$(printf '%s\n' "$api_names" | grep -vE '^(gh:|To use GitHub CLI|error:|fatal:)' | grep -v '^[[:space:]]*$' || true)
          diag="api rc=$rc archivos=$(printf '%s\n' "$api_names" | grep -c . || true)"

          # La API corta en 300 archivos. Si los toca todos, la lista puede
          # estar incompleta y no serviría para decidir: se reconstruye.
          n_api=$(printf '%s\n' "$api_names" | grep -c . || true)
          if [ "$rc" != "0" ] || [ "$n_api" -eq 0 ]; then
            echo "── git diff (respaldo)"
            changed=$(git diff --name-only "$BEFORE" "$AFTER" 2>/dev/null | grep -v '^[[:space:]]*$' || true)
            diag="$diag | git nombres=$(printf '%s\n' "$changed" | grep -c . || true)"
          else
            changed=$(printf '%s\n' "$api_names")
          fi

          if [ "$n_api" -ge 300 ]; then
            echo "DIAG gate: $diag -> >=300 archivos, la lista podría estar truncada; se reconstruye"
            echo "modo=rebuild" >> "$GITHUB_OUTPUT"
            echo "motivo=push demasiado grande para decidir por lista" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          n=$(printf '%s\n' "$changed" | grep -c . || true)
          if [ "$n" -eq 0 ]; then
            echo "DIAG gate: $diag"
            echo "no se pudo determinar qué cambió; se reconstruye por seguridad"
            echo "  (detalle arriba en 'DIAG gate')"
            echo "modo=rebuild" >> "$GITHUB_OUTPUT"
            echo "motivo=no se pudo determinar qué cambió" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "DIAG gate: $diag"
          echo "Cambios en este push: $n"
          printf '%s\n' "$changed" | sed 's/^/  /'

          # Lo que de verdad cambia la imagen. Todo lo demás se publica copiando
          # al contenedor que ya corre, sin docker build.
          tocaba=$(printf '%s\n' "$changed" \
            | grep -E '^(Dockerfile|requirements\.txt|api/requirements\.txt)$' || true)
          if [ -n "$tocaba" ]; then
            echo "modo=REBUILD: cambiaron $(echo "$tocaba" | tr '\n' ' ')"
            echo "modo=rebuild" >> "$GITHUB_OUTPUT"
            echo "motivo=cambió un insumo de la imagen" >> "$GITHUB_OUTPUT"
          else
            echo "modo=HOTSYNC: sin rebuild"
            echo "modo=hotsync" >> "$GITHUB_OUTPUT"
            echo "motivo=solo cambió código y estáticos" >> "$GITHUB_OUTPUT"
          fi

  build-image:
    # ─────────────────────────────────────────────────────────────────────────────
    # ESTÁNDAR DE DESPLIEGUE — el mismo en las 6 apps:
    #   1. build + push a ghcr.io, AQUÍ en la nube
    #   2. el servidor solo BAJA la imagen — nunca compila
    #   3. Arcane ve el digest nuevo y el operador da "Update" en la UI
    #
    # Antes este build corría en el runner del servidor, que tiene 1 vCPU y
    # 1.9 GB de RAM: compilar ahí competía por memoria con las apps en
    # producción. Moverlo acá es lo que libera el server.
    #
    # El Dockerfile arma el frontend (Vite) en una etapa node:20-alpine, así que
    # este job no necesita npm aparte.
    # ─────────────────────────────────────────────────────────────────────────────
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: gate
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumen
        run: |
          {
            echo "### Imagen publicada en la nube"
            echo ""
            echo "- **sha**: \`${{ github.sha }}\`"
            echo "- **tags**: \`${{ github.repository_owner }}/${{ github.event.repository.name }}\` → :latest + :sha"
            echo "- **runner**: \`${{ runner.name }}\` (nube — el servidor no compiló nada)"
            echo ""
            echo "Arcane ya la ve como actualización pendiente:"
            echo "**Projects → admon → Updates → Update**."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    # Etiqueta propia del runner de WebbApps (Linux). NO usar `self-hosted`: con
    # esa etiqueta el job podría caer en el runner Windows viejo, que es
    # justamente de donde viene este cambio.
    runs-on: admon-deploy
    timeout-minutes: 30
    needs: [gate, build-image]

    env:
      # Se baja el tag por sha, que es inmutable. Con ":latest" dos builds en
      # paralelo podrían pisarse. Lo heredan los dos pasos: Hotsync delega en
      # este mismo rebuild-linux.sh cuando Arcane es el dueño.
      IMAGE_REF: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ github.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          # El hotsync/rebuild necesitan el código, incluido dist/ tras compilar.
          fetch-depth: 0

      - name: Resumen
        run: |
          {
            echo "### Deploy de Admon → WebbApps (10.188.141.17)"
            echo ""
            echo "- **modo**: ${{ needs.gate.outputs.modo }}"
            echo "- **por qué**: ${{ needs.gate.outputs.motivo }}"
            echo "- **runner**: ${{ runner.name }}"
            echo "- **commit**: ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Hotsync
        if: needs.gate.outputs.modo == 'hotsync'
        run: bash deploy/hotsync-linux.sh

      - name: Rebuild
        if: needs.gate.outputs.modo == 'rebuild'
        env:
          # rebuild-linux.sh publica la imagen en GHCR con este token. Sin el,
          # la imagen queda solo en el server y Arcane nunca ve actualizaciones.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash deploy/rebuild-linux.sh