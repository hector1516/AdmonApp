# ─────────────────────────────────────────────────────────────────────────────
# Admon · rotar el HUB_PANEL_TOKEN en WebbApps
#
# Para qué: ese secret es el que comparten Admon y el kiosco Dashboard. Cuando
# se regenera en GitHub hay que llevarlo al servidor, y al contenedor que lo
# usa.
#
# ANTES: este workflow depositaba el secret en `C:\admon\.secrets\panel_token`
# para que build.ps1 lo leyera, en el ServerVM Windows (10.188.141.31). Ese
# servidor ya no publica la app y el workflow escribía en un sitio donde nada lo
# leía. Ahora el secret vive en `/etc/admon.env` en WebbApps (10.188.141.17), que
# es lo que lee `/opt/apps/_lib/run_app.sh` al crear el contenedor.
#
# El valor NUNCA se imprime, ni en el log del job ni en el repo.
# ─────────────────────────────────────────────────────────────────────────────
name: Aplicar HUB_PANEL_TOKEN

on:
  workflow_dispatch:
    inputs:
      motivo:
        description: 'Por qué se rota el token (queda en el log del job)'
        required: false
        default: 'rotación manual'

permissions:
  contents: read

jobs:
  aplicar:
    # Etiqueta del runner de WebbApps (Linux). Con `self-hosted` este job
    # caería en el runner Windows viejo, que ya no sirve para nada.
    runs-on: admon-deploy
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Estado previo (sin el valor)
        run: |
          set -euo pipefail
          echo "motivo: ${{ inputs.motivo }}"
          echo "── /etc/admon.env"
          sudo -n awk -F= '/^HUB_PANEL_TOKEN=/{print "  HUB_PANEL_TOKEN: presente (" length($2) " caracteres)"}' /etc/admon.env \
            || echo "  HUB_PANEL_TOKEN: NO está en /etc/admon.env (se agrega)"
          echo "── contenedor admon"
          sudo -n docker inspect admon --format '  {{.State.Status}} · {{.Config.Image}}'
          if sudo -n docker inspect admon --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -q '^HUB_PANEL_TOKEN='; then
            echo "  HUB_PANEL_TOKEN en el contenedor: presente"
          else
            echo "  HUB_PANEL_TOKEN en el contenedor: AUSENTE"
          fi

      - name: Depositar el token en /etc/admon.env
        env:
          PANEL_TOKEN: ${{ secrets.HUB_PANEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$PANEL_TOKEN" ]; then
            echo "::error::secrets.HUB_PANEL_TOKEN viene vacío en este repo"
            exit 1
          fi
          # El valor va por una variable de entorno, nunca en la línea de
          # comandos: así no aparece en la lista de procesos del servidor.
          # `admon-set-secret` es un helper de root que reescribe una sola clave
          # del env-file; sin él el runner no puede tocar un archivo root.
          sudo -n admon-set-secret HUB_PANEL_TOKEN "$PANEL_TOKEN"
          sudo -n awk -F= '/^HUB_PANEL_TOKEN=/{print "  depositado (" length($2) " caracteres)"}' /etc/admon.env

      - name: Recrear el contenedor para que reciba el token
        run: |
          set -euo pipefail
          # `docker restart` NO recarga el env: las variables se fijan al crear
          # el contenedor, así que hay que recrearlo.
          sudo -n /opt/apps/_lib/run_app.sh admon
          sudo -n docker start admon >/dev/null 2>&1 || true

      - name: Verificar
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8103/health || true)
            if [ "$CODE" = "200" ]; then
              echo "  salud OK (intento $i)"
              sudo -n docker inspect admon --format '  {{.State.Status}}'
              exit 0
            fi
            sleep 2
          done
          echo "::error::admon no respondió en /health después de 60 s"
          sudo -n docker logs --tail 40 admon
          exit 1