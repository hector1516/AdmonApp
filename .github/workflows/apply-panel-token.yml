name: Aplicar HUB_PANEL_TOKEN (recrea el contenedor)

# El control remoto de la TV necesita HUB_PANEL_TOKEN en el ENV del contenedor
# `admon`. Un env no se puede mutar en caliente: hay que recrear el contenedor,
# y recrearlo lo hace la tarea programada AdmonBuild (deploy/build.ps1), que es
# un proceso de OTRA sesión de Windows — por eso no alcanza con que este
# workflow tenga el secret en su entorno.
#
# Este workflow hace el trinquete completo:
#   1) deposita el secret en C:\admon\.secrets\panel_token (fuera de git),
#   2) dispara la tarea AdmonBuild, que recrea el contenedor leyéndolo de ahí,
#   3) deja el resultado en build.log.
#
# Uso: GitHub → Actions → "Aplicar HUB_PANEL_TOKEN" → Run workflow.
# Normally NO hace falta: el deploy de cada push ya inyecta el token si viene en
# el secret. Este workflow es para (re)aplicarlo sin hacer push.

on:
  workflow_dispatch:
    inputs:
      motivo:
        description: 'Motivo (queda en el log del workflow)'
        required: false
        default: 'aplicar / reaplicar HUB_PANEL_TOKEN al contenedor'

permissions:
  contents: read

jobs:
  aplicar:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Depositar HUB_PANEL_TOKEN
        shell: 'powershell -ExecutionPolicy Bypass -command ". {0}"'
        env:
          PANEL_TOKEN: ${{ secrets.HUB_PANEL_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host ("motivo: " + '${{ inputs.motivo }}')
          if (-not $env:PANEL_TOKEN) {
            throw 'secrets.HUB_PANEL_TOKEN viene vacio en este repo'
          }
          $dir = 'C:\admon\.secrets'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Set-Content -Path "$dir\panel_token" -Value $env:PANEL_TOKEN -Encoding ascii -NoNewline
          Write-Host ('OK · depositado en {0}\panel_token' -f $dir)

      - name: Estado previo de C:\admon
        shell: 'powershell -ExecutionPolicy Bypass -command ". {0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host ('HEAD  : ' + (git -C C:\admon rev-parse --short HEAD))
          $dirty = git -C C:\admon status --porcelain
          Write-Host ('sucio : ' + $(if ($dirty) { (($dirty | Select-Object -First 5) -join '; ') } else { 'no' }))
          $b = 'C:\admon\deploy\build.ps1'
          Write-Host ('build.ps1 tiene node:20-alpine : ' + (Select-String -Path $b -Pattern 'node:20-alpine' -Quiet))
          Write-Host ('build.ps1 tiene ruta absoluta token : ' + (Select-String -Path $b -Pattern "C:\\admon\\.secrets" -Quiet))
          $dist = Get-ChildItem 'C:\admon\dist\assets\index-*.js' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($dist) { Write-Host ('dist : ' + $dist.Name + '  ' + $dist.LastWriteTime) } else { Write-Host 'dist : NO EXISTE' }

      - name: Recrear el contenedor (AdmonBuild)
        shell: 'powershell -ExecutionPolicy Bypass -command ". {0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $logPath = 'C:\admon\build.log'
          if (Test-Path $logPath) { Move-Item $logPath "$logPath.prev" -Force }
          schtasks /run /tn AdmonBuild
          if ($LASTEXITCODE -ne 0) { throw 'no se pudo lanzar AdmonBuild' }
          $rc = $null
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 10
            $log = Get-Content $logPath -ErrorAction SilentlyContinue
            $line = $log | Select-String 'FIN rc=(\d+)' | Select-Object -Last 1
            if ($line) {
              # Se imprime bastante del build.log: el paso 2 (compilación del
              # frontend) y el docker run son los que hay que poder auditar en
              # este workflow sin volver a lanzarlo.
              Get-Content $logPath -Tail 120 | ForEach-Object { Write-Host $_ }
              $rc = [int]$line.Matches[0].Groups[1].Value
              break
            }
          }
          if ($null -eq $rc) { throw 'AdmonBuild no escribio FIN rc= a tiempo' }
          if ($rc -ne 0) { throw "AdmonBuild termino con rc=$rc" }
          Write-Host 'Contenedor recreado con el token aplicado.'
